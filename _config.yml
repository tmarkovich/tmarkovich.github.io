#
###################################
# Site wide configuration
####################################
#
title: "Thomas Markovich"
email: thomasmarkovich@gmail.com
description: "Essays on technology and the practice of building it, plus notes from a career in machine learning research."
url: "https://thomasmarkovich.com" # base hostname & protocol, no trailing slash
baseurl: "" # site is served from the domain root

# Header navigation, in order. RSS is appended automatically.
nav:
  - title: Archive
    url: /archive/
  - title: Sections
    url: /categories/
  - title: About
    url: /about/
  - title: Resume
    url: /resume/

#
###################################
# Jekyll configuration
####################################
#
timezone:          America/New_York
markdown:          kramdown
highlighter:       rouge
excerpt_separator: <!--more-->
permalink:         /articles/:year-:month/:title

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

compress_html:
  clippings: all
  comments: ["<!--", "-->"]
  endings: all
  ignore:
    envs: [development]

exclude:
  - README.md
  - LICENSE.txt
  - Rakefile
  - vendor

#
###################################
# Site Owner configuration
####################################
#
owner:
  name: "Thomas Markovich"
  job: "Machine Learning Research Scientist"
  bio: "Machine learning research scientist. I write about the systems we build and what it means to build them."
  email: thomasmarkovich@gmail.com
  github: tmarkovich
  linkedin: thomas-markovich-75618044
  google_scholar: "https://scholar.google.com/citations?user=o0YtLvgAAAAJ&hl=en"
